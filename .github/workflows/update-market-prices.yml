name: Update market prices

on:
  schedule:
    # KST Mon-Fri 09:00-20:00 (UTC 00:00-11:00)
    - cron: "*/5 0-11 * * 1-5"
    # KST Mon-Fri 08:00-08:55 NXT pre-market (UTC Sun-Thu 23:00-23:55)
    - cron: "*/5 23 * * 0-4"
  push:
    branches: [main]
    paths:
      - "scripts/update_market_prices.py"
      - ".github/workflows/update-market-prices.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KRX and NXT prices
        run: python scripts/update_market_prices.py
      - name: Save changed prices
        run: |
          if git diff --quiet -- data/market_prices.json; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_prices.json
          git commit -m "Update KRX and NXT market prices"
          git push
