name: Update market prices

on:
  schedule:
    - cron: "*/5 0-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current prices
        run: python scripts/update_market_prices.py
      - name: Save changed prices
        run: |
          if git diff --quiet -- data/market_prices.json; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_prices.json
          git commit -m "Update intraday market prices"
          git push
